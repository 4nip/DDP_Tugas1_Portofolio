<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home - Lutfi Hanif{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-navy: #0f172a;    /* Navy Pekat untuk Font Utama */
            --secondary-blue: #2563eb;  /* Biru Terang untuk Button/Link */
            --accent-cyan: #22d3ee;     /* Cyan untuk Highlight */
            --dark-navy: #020617; 
            --light-bg: #f8fafc;
            --gradient-vibrant: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            color: var(--primary-navy);
        }

        /* --- MODIFIKASI SEMUA BUTTON (GLOBAL) --- */
        .btn-custom {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* Button Utama (Gradient) */
        .btn-main {
            background: var(--gradient-vibrant);
            color: white !important;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-main:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);
            color: white !important;
        }

        /* Button Outline (Transparent) */
        .btn-outline-custom {
            background: transparent;
            border: 2px solid var(--secondary-blue);
            color: var(--secondary-blue) !important;
        }

        .btn-outline-custom:hover {
            background: var(--secondary-blue);
            color: white !important;
            transform: translateY(-5px);
        }

        /* --- NAVBAR & TEXT --- */
        .navbar {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(30, 58, 138, 0.1);
            padding: 15px 0;
        }

        .navbar-brand {
            font-weight: 800;
            background: var(--gradient-vibrant);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--primary-navy) !important;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--secondary-blue) !important;
        }

        /* --- FOOTER (Teks Lebih Jelas) --- */
        footer {
            background: var(--dark-navy);
            padding: 80px 0 40px;
            color: #ffffff;
        }

        .footer-desc {
            color: #cbd5e1 !important; /* Abu-abu terang agar kontras */
            line-height: 1.8;
        }

        .social-icons a {
            width: 50px;
            height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: var(--gradient-vibrant);
            border-color: transparent;
            transform: scale(1.1) rotate(8deg);
            color: white;
        }

        .footer-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            margin: 40px 0;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'main:home' %}">
                <i class="fas fa-code"></i> PORTOFOLIO
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'main:home' %}"><i class="fas fa-house"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'main:about' %}"><i class="fas fa-user"></i> About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'main:gallery' %}"><i class="fas fa-images"></i> Gallery</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main style="padding-top: 100px; min-height: calc(100vh - 400px);">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <div class="mb-4">
                <h4 class="fw-bold mb-3">My <span style="color: var(--accent-cyan);">Social Media</span></h4>
            </div>

            <div class="social-icons mb-4">
                <a href="https://www.facebook.com/lutfi.hanif.5074"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/lutfiihaniff_/"><i class="fab fa-instagram"></i></a>
                <a href="https://github.com/4nip"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/lutfi-hanif-775862360/"><i class="fab fa-linkedin-in"></i></a>
            </div>

            <div class="footer-divider"></div>

            <p class="mb-0 small" style="color: #94a3b8;">
                &copy; 2026 <strong style="color: white;">Lutfi Hanif</strong>. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
